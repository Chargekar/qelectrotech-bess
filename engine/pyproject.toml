[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengrid-engineer"
version = "0.1.0"
description = "CLI-first, auditable electrical engineering model and simulation tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "OpenGrid Engineer contributors"}]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
  "networkx>=3,<4",
]

[project.optional-dependencies]
sim = ["dss-python>=0.15,<0.17"]
draw = ["ezdxf>=1.3,<2", "cairosvg>=2.7,<3"]
ingest = ["pdfplumber>=0.11,<1", "pypdfium2>=4,<6"]
dev = ["pytest>=8,<10"]
all = ["dss-python>=0.15,<0.17", "ezdxf>=1.3,<2", "cairosvg>=2.7,<3", "pdfplumber>=0.11,<1", "pypdfium2>=4,<6", "pytest>=8,<10"]

[project.scripts]
og = "opengrid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
